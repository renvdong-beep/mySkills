stages:
  - build
  - obs-trigger
  - obs-wait
  - sync
  - quality-gate
  - update-repo

variables:
  # PACKAGE_NAME and PACKAGE_DIR should be set as CI/CD variables per project
  # If not set, fallback to CI_PROJECT_NAME
  PACKAGE_NAME: "${CI_PROJECT_NAME}"
  PACKAGE_DIR: "${CI_PROJECT_NAME}"

.build_template: &build_template
  stage: build
  tags:
    - docker
  script:
    - echo "Building ${PACKAGE_NAME}..."
    - mkdir -p /tmp/${PACKAGE_NAME}-1.0.0
    - cp -r ${PACKAGE_DIR}/* /tmp/${PACKAGE_NAME}-1.0.0/
    - cd /tmp && tar -czvf ${CI_PROJECT_DIR}/${PACKAGE_NAME}-1.0.0.tar.gz ${PACKAGE_NAME}-1.0.0/
  artifacts:
    paths:
      - ${PACKAGE_NAME}-1.0.0.tar.gz
    expire_in: 1 day

.obs_trigger_template: &obs_trigger_template
  stage: obs-trigger
  tags:
    - docker
  script:
    - |
      OBS_PROJECT="home:Admin:${PACKAGE_NAME}"
      echo "Uploading source to OBS project: ${OBS_PROJECT}"
      # Upload tarball
      curl -s -u Admin:admin123 -X PUT -T ${PACKAGE_NAME}-1.0.0.tar.gz \
        "http://localhost:4455/source/${OBS_PROJECT}/${PACKAGE_NAME}/${PACKAGE_NAME}-1.0.0.tar.gz"
      # Upload spec file
      curl -s -u Admin:admin123 -X PUT -T ${PACKAGE_DIR}/${PACKAGE_NAME}.spec \
        "http://localhost:4455/source/${OBS_PROJECT}/${PACKAGE_NAME}/${PACKAGE_NAME}.spec"
  needs:
    - build

.obs_wait_template: &obs_wait_template
  stage: obs-wait
  tags:
    - docker
  script:
    - |
      OBS_PROJECT="home:Admin:${PACKAGE_NAME}"
      echo "Waiting for OBS build to complete for ${OBS_PROJECT}/${PACKAGE_NAME}..."
      for i in $(seq 1 60); do
        STATUS=$(curl -s "http://localhost:8090/obs-build-status/${OBS_PROJECT}/${PACKAGE_NAME}" | python3 -c "import sys,json; d=json.loads(sys.stdin.read()); print(d.get('overall','unknown'))" 2>/dev/null || echo "unknown")
        echo "Attempt $i: Status=$STATUS"
        if [ "$STATUS" = "succeeded" ]; then
          echo "Build succeeded!"
          exit 0
        elif [ "$STATUS" = "failed" ]; then
          echo "Build failed!"
          exit 1
        fi
        sleep 30
      done
      echo "Timeout waiting for build"
      exit 1
  needs:
    - obs-trigger

.sync_template: &sync_template
  stage: sync
  tags:
    - docker
  script:
    - |
      OBS_PROJECT="home:Admin:${PACKAGE_NAME}"
      echo "Syncing ${OBS_PROJECT}/${PACKAGE_NAME} for ${ARCH}..."
      curl -s -X POST "http://localhost:8090/sync/${OBS_PROJECT}/${PACKAGE_NAME}/standard/${ARCH}"
  needs:
    - obs-wait

.quality_gate_template: &quality_gate_template
  stage: quality-gate
  tags:
    - docker
  script:
    - |
      OBS_PROJECT="home:Admin:${PACKAGE_NAME}"
      echo "Running quality gate for ${OBS_PROJECT}/${PACKAGE_NAME} ${ARCH}..."
      curl -s "http://localhost:8081/check/${OBS_PROJECT}/${PACKAGE_NAME}/standard/${ARCH}"
  needs:
    - sync-x86_64
    - sync-aarch64
  allow_failure: true

.update_repo_template: &update_repo_template
  stage: update-repo
  tags:
    - docker
  script:
    - |
      echo "Updating integration repo metadata..."
      curl -s -X POST "http://localhost:8090/sync-all/home:Admin/standard/x86_64"
      curl -s -X POST "http://localhost:8090/sync-all/home:Admin/standard/aarch64"
  needs:
    - quality-gate-x86_64
    - quality-gate-aarch64

# Job definitions
build:
  <<: *build_template

obs-trigger:
  <<: *obs_trigger_template

obs-wait:
  <<: *obs_wait_template

sync-x86_64:
  <<: *sync_template
  variables:
    ARCH: "x86_64"

sync-aarch64:
  <<: *sync_template
  variables:
    ARCH: "aarch64"

quality-gate-x86_64:
  <<: *quality_gate_template
  variables:
    ARCH: "x86_64"

quality-gate-aarch64:
  <<: *quality_gate_template
  variables:
    ARCH: "aarch64"

update-repo:
  <<: *update_repo_template
