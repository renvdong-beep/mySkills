# OBS Project Configuration for openEuler 24.03
# Usage: curl -u Admin:admin123 -X PUT -d @openeuler-project-config.conf \
#        "http://localhost:4455/source/<project>/_config"

Type: spec

# Required for rpm based builds
Required: rpm-build

# Preinstall packages - minimal set that works
# rpm: provides rpm/rpmdb commands
# util-linux: provides 'su' command for chroot
# chkconfig: provides 'alternatives' for binutils ld symlink
Preinstall: rpm util-linux chkconfig

# Order constraints - filesystem must come first
# Without these, glibc creates /lib64 before filesystem can
Order: filesystem:glibc
Order: filesystem:setup
Order: filesystem:libgcc
Order: filesystem:bash

# Prefer filesystem to be installed first
Prefer: filesystem

# Expand preinstall packages to include dependencies
ExpandFlags: preinstallexpand
